[pytest]

python_files = test_*.py
python_classes = Test*
python_functions = test_*

asyncio_mode = auto
asyncio_default_fixture_loop_scope = session

addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:warnings
    --color=yes
    --durations=10
    -p no:seleniumbase

markers =
    asyncio: marks tests as async (deselect with '-m "not asyncio"')
    slow: marks tests as slow (deselect with '-m "not slow"')
    parallel: marks tests that run in parallel
    live: marks tests that need a real browser/network (deselect with '-m "not live"')

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %H:%M:%S

[coverage:run]
source = cf_handler
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
