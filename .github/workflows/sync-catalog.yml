name: Sinkron katalog AniList

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "ongoing atau full"
        default: "full"
  schedule:
    - cron: "17 */6 * * *"
    - cron: "47 3 * * *"

permissions:
  contents: read

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sinkron
        env:
          WORKER_URL: https://milkglass-backend.milkyliquid.workers.dev
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          SCOPE: ${{ github.event.inputs.scope || (github.event.schedule == '47 3 * * *' && 'full' || 'ongoing') }}
        run: |
          set +e
          node frontend/scripts/sync-catalog.mjs > out.txt 2>&1; RC=$?
          cat out.txt
          MSG=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' out.txt | head -c 3500)
          echo "::notice title=sync::$MSG"
          exit $RC
