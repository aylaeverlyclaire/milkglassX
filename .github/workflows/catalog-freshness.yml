name: Cek kesegaran katalog

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      WORKER_URL: https://milkglass-backend.milkyliquid.workers.dev
      MIN_TOTAL: "300"
    steps:
      - uses: actions/checkout@v4
      - name: Periksa /v1/catalog/status
        run: node frontend/scripts/check-freshness.mjs
