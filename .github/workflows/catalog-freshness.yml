name: Cek kesegaran katalog

# Gagal (dan GitHub mengirim email) bila katalog basi, terlalu sedikit, atau Worker tidak menjawab.
# "Basi" = lebih dari 18 jam sejak impor terakhir (ditentukan Worker: CATALOG_STALE_AFTER_SEC).
# Peringatan: workflow terjadwal di repo publik dinonaktifkan GitHub setelah 60 hari tanpa aktivitas repo,
# dan pengawas ini ikut mati. Satu commit atau "Enable workflow" di tab Actions menghidupkannya lagi.

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      WORKER_URL: https://milkglass-backend.milkyliquid.workers.dev
      MIN_TOTAL: "300"
    steps:
      - uses: actions/checkout@v4
      - name: Periksa /v1/catalog/status
        run: node frontend/scripts/check-freshness.mjs
