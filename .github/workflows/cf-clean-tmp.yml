name: CF clean (sementara)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clean:
    runs-on: ubuntu-24.04
    env:
      T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Bersihkan
        run: |
          exec > out.txt 2>&1
          B=https://api.cloudflare.com/client/v4/accounts/$A
          g() { curl -sS -m 60 -H "Authorization: Bearer $T" "$@"; }
          echo "== hapus worker milkglass-backend"
          g -X DELETE "$B/workers/scripts/milkglass-backend?force=true" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('success'),d.get('errors'))"
          echo "== hapus D1 milkglass_db"
          for ID in $(g "$B/d1/database?per_page=100" | python3 -c "import sys,json;print(' '.join(x['uuid'] for x in json.load(sys.stdin).get('result') or [] if x['name']=='milkglass_db'))"); do
            g -X DELETE "$B/d1/database/$ID" | python3 -c "import sys,json;d=json.load(sys.stdin);print('$ID',d.get('success'),d.get('errors'))"
          done
          echo "== sisa"
          g $B/workers/scripts | python3 -c "import sys,json;print('workers',[s['id'] for s in json.load(sys.stdin).get('result') or []])"
          g "$B/d1/database?per_page=100" | python3 -c "import sys,json;print('d1',[x['name'] for x in json.load(sys.stdin).get('result') or []])"
      - name: Lapor
        if: always()
        run: |
          cat out.txt
          MSG=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' out.txt | head -c 3500)
          echo "::notice title=clean::$MSG"
