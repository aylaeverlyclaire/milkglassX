name: Verify Milkglass Backend & Android Engine

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/milkglass-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/milkglass-backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  android-compile-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Gradle compile and test
        run: |
          set +e
          ./gradlew :engine:compileDebugKotlin :app:compileDebugKotlin :engine:testDebugUnitTest --stacktrace > g.txt 2>&1; RC=$?
          tail -5 g.txt
          if [ $RC -ne 0 ]; then
            MSG=$(grep -E '^e: |What went wrong|^> |Execution failed|FAILED|AssertionError|Caused by' g.txt | head -30 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' | head -c 3500)
            echo "::error title=gradle::$MSG"
          fi
          exit $RC
