name: Verify Milkglass Backend, CF Handler & Android Engine

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend-typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/milkglass-backend/package-lock.json
      - name: Typecheck milkglass-backend
        working-directory: frontend/milkglass-backend
        run: |
          npm ci
          npx tsc --noEmit
      - name: Uji skrip sinkronisasi katalog (mock, tanpa jaringan)
        run: node --test frontend/scripts/*.test.mjs

  cf-handler-unit-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cf-handler
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            cf-handler/server_requirements.txt
            cf-handler/tests/test-requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server_requirements.txt
          pip install -r tests/test-requirements.txt
      - name: Run cf-handler unit tests (non-live)
        run: python -m pytest -c tests/pytest.ini tests -m "not live" -v --tb=short --timeout=120

  android-compile-and-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Gradle compile and unit tests
        run: |
          set +e
          ./gradlew :engine:compileDebugKotlin :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin :engine:testDebugUnitTest :app:testDebugUnitTest --stacktrace > g.txt 2>&1; RC=$?
          tail -5 g.txt
          if [ $RC -ne 0 ]; then
            MSG=$( (grep -E '^e: ' g.txt | sed 's#file:///home/runner/work/milkglassX/milkglassX/frontend/##' | head -25; grep -E 'Test.*FAILED|AssertionError|What went wrong' -A2 g.txt | head -15) | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' | head -c 3500)
            echo "::error title=gradle::$MSG"
          fi
          exit $RC
