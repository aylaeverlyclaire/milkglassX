name: Android Emulator UI Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/app/**"
      - "frontend/engine/**"
      - "frontend/gradle/**"
      - ".github/workflows/android-emulator-smoke.yml"

permissions:
  contents: read

concurrency:
  group: android-emulator-smoke
  cancel-in-progress: true

jobs:
  emulator-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM access
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
            ls -la /dev/kvm
          fi
      - name: Run instrumented UI smoke tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          working-directory: frontend
          script: |
            set +e
            chmod +x gradlew
            adb logcat -c
            ./gradlew :app:connectedDebugAndroidTest --stacktrace --console=plain > emulator-test.log 2>&1
            RC=$?
            tail -n 60 emulator-test.log
            adb exec-out screencap -p > emulator-screen.png 2>/dev/null || true
            adb logcat -d -t 500 > emulator-logcat.txt 2>/dev/null || true
            exit $RC
      - name: Upload emulator test report, logcat, and screenshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: emulator-smoke-diagnostics
          if-no-files-found: ignore
          path: |
            frontend/emulator-test.log
            frontend/emulator-logcat.txt
            frontend/emulator-screen.png
            frontend/app/build/reports/androidTests/connected/**
