name: Indeks Multi-Hoster Katalog

on:
  workflow_dispatch:
    inputs:
      max_animes:
        description: "Jumlah maksimum anime katalog yang diindeks"
        default: "300"
      max_eps:
        description: "Jumlah maksimum episode per anime (selalu termasuk Ep 1 + terbaru)"
        default: "4"
  schedule:
    - cron: "23 */12 * * *"

permissions:
  contents: read

concurrency:
  group: index-hosters
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Indeks & verifikasi multi-hoster ke Cloudflare D1
        env:
          WORKER_URL: https://milkglass-backend.milkyliquid.workers.dev
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          MAX_ANIMES: ${{ github.event.inputs.max_animes || '300' }}
          MAX_EPS_PER_ANIME: ${{ github.event.inputs.max_eps || '4' }}
          CONCURRENCY: "6"
        run: |
          set +e
          node frontend/scripts/index-hosters.mjs > out.txt 2>&1; RC=$?
          tail -n 60 out.txt
          MSG=$(tail -n 25 out.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' | head -c 3500)
          echo "::notice title=index-hosters::$MSG"
          exit $RC
