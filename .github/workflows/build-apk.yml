name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["frontend/app/**", "frontend/engine/**", "frontend/gradle/**", "frontend/*.kts", ".github/workflows/build-apk.yml"]

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Pasang SDK
        run: |
          set +o pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager)"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-37" "build-tools;36.0.0" "platform-tools" | tail -n 3
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - uses: gradle/actions/setup-gradle@v6
      - name: Unduh font Roboto
        run: |
          D=app/src/main/res/font; mkdir -p "$D"
          B=https://raw.githubusercontent.com/google/fonts/main/ofl
          get() { curl -fsSL --retry 3 -o "$2" "$1" && [ "$(stat -c%s "$2")" -gt 50000 ] || { rm -f "$2"; echo "::warning::gagal unduh $2"; }; }
          get "$B/roboto/Roboto%5Bwdth%2Cwght%5D.ttf" "$D/roboto_variable.ttf"
          get "$B/robotomono/RobotoMono%5Bwght%5D.ttf" "$D/roboto_mono_variable.ttf"
      - name: Build APK release
        run: |
          set +e
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace --console=plain > g.txt 2>&1; RC=$?
          tail -5 g.txt
          if [ $RC -ne 0 ]; then
            MSG=$( (grep -E '^e: ' g.txt | sed 's#file:///home/runner/work/[^/]*/[^/]*/frontend/##' | head -25; grep -E 'What went wrong|Could not|Execution failed' -A2 g.txt | head -15) | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' | head -c 3500)
            echo "::error title=apk::$MSG"
          fi
          exit $RC
      - uses: actions/upload-artifact@v6
        with:
          name: milkglass-release-apk
          path: frontend/app/build/outputs/apk/release/*.apk
      - name: Terbitkan APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/release/*.apk milkglass.apk
          gh release delete apk-terbaru --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-terbaru milkglass.apk --target "${{ github.sha }}" --prerelease \
            --title "APK terbaru (build #${{ github.run_number }})" \
            --notes "Commit ${{ github.sha }}. Pasang langsung; pembaruan menimpa versi lama."
